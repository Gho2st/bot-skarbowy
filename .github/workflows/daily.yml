name: Bot Skarbowy (codziennie)

on:
  schedule:
    # Minuta inna niż :00 – o pełnych godzinach GitHub jest przeciążony
    # i potrafi opóźniać albo pomijać zaplanowane uruchomienia.
    - cron: "37 4 * * *" # 04:37 UTC, czyli 05:37 (zima) / 06:37 (lato) w Polsce
  workflow_dispatch: # ręczne uruchomienie: Actions → Run workflow

permissions:
  contents: write

# Nigdy dwa uruchomienia naraz (inaczej kłócą się przy zapisie historii do repo)
concurrency:
  group: bot-skarbowy
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pobieranie repozytorium
        uses: actions/checkout@v4

      - name: Instalacja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalacja bibliotek
        run: pip install -r requirements.txt

      - name: Uruchomienie bota
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python main.py

      - name: Zapisywanie historii
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add historia_linkow.txt okazje_licytacje*.csv || true
          git commit -m "Zaktualizowano bazę ofert" || echo "Brak nowych danych"
          git pull --rebase --autostash || true
          git push
